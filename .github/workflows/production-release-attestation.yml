name: Production Release Attestation

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact origin/master SHA to approve
        required: true
        type: string
      release_tag:
        description: Annotated prod tag name (prod-YYYYMMDD.N)
        required: true
        type: string

permissions:
  attestations: write
  artifact-metadata: write
  contents: read
  id-token: write

jobs:
  verify-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate release tag format (prod-YYYYMMDD.N)
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          case "$RELEASE_TAG" in
            prod-[0-9][0-9][0-9][0-9][0-1][0-9][0-3][0-9].[0-9]*) ;;
            *)
              echo "release_tag must match prod-YYYYMMDD.N" >&2
              exit 1
              ;;
          esac

      - name: Checkout exact release SHA
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_sha }}

      - name: Verify exact release SHA equals origin/master
        id: git
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          git fetch origin master --tags --force
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse refs/remotes/origin/master^{commit})" = "$RELEASE_SHA"
          printf 'release_tree=%s\n' "$(git rev-parse "$RELEASE_SHA^{tree}")" >> "$GITHUB_OUTPUT"

      - name: Download current rulesets for prereq verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/rulesets-actual"
          rule_ids="$(gh api repos/${{ github.repository }}/rulesets --paginate --jq '.[].id')"
          test -n "$rule_ids"
          for rule_id in $rule_ids; do
            rule_name="$(gh api repos/${{ github.repository }}/rulesets/"$rule_id" --jq '.name')"
            gh api repos/${{ github.repository }}/rulesets/"$rule_id" \
              > "$RUNNER_TEMP/rulesets-actual/$rule_name.json"
          done

      - name: Verify ruleset prerequisites against desired state
        run: |
          node scripts/manage-production-release-rulesets.mjs \
            verify \
            --actual-dir "$RUNNER_TEMP/rulesets-actual" \
            --json \
            > "$RUNNER_TEMP/rulesets-verify.json"
          jq -e '
            .activation_blocked == false
            and .actual_state == "matched"
          ' "$RUNNER_TEMP/rulesets-verify.json" > /dev/null

      - name: Download current-head check runs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          gh api \
            repos/${{ github.repository }}/commits/"$RELEASE_SHA"/check-runs \
            --paginate \
            --jq '.check_runs[]' \
            > "$RUNNER_TEMP/check-runs.jsonl"
          jq -s '.' "$RUNNER_TEMP/check-runs.jsonl" > "$RUNNER_TEMP/check-runs.json"

      - name: Download current-head commit statuses
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          gh api \
            repos/${{ github.repository }}/commits/"$RELEASE_SHA"/status \
            --jq '.statuses' \
            > "$RUNNER_TEMP/commit-statuses.json"

      - name: Build terminal check summary custom predicate and subject manifest
        env:
          EXPECTED_RELEASE_CONTEXTS: build,changes,policy,quality,security-function-authorization,security-smoke,template-check
        run: |
          node scripts/build-production-release-attestation.mjs \
            --repository "${{ github.repository }}" \
            --release-sha "${{ inputs.release_sha }}" \
            --release-tag "${{ inputs.release_tag }}" \
            --release-tree "${{ steps.git.outputs.release_tree }}" \
            --check-runs-json "$RUNNER_TEMP/check-runs.json" \
            --commit-statuses-json "$RUNNER_TEMP/commit-statuses.json" \
            --expected-contexts "$EXPECTED_RELEASE_CONTEXTS" \
            --subject-output "$RUNNER_TEMP/production-release-subject.json" \
            --predicate-output "$RUNNER_TEMP/production-release-predicate.json" \
            > "$RUNNER_TEMP/production-release-build.json"
          jq -e '
            .subject_manifest_sha256
            and .predicate.required_check_summary
            and .subject.required_check_summary
          ' "$RUNNER_TEMP/production-release-build.json" > /dev/null

      - name: Upload subject, predicate, and ruleset verification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-release-attestation-inputs
          path: |
            ${{ runner.temp }}/production-release-build.json
            ${{ runner.temp }}/production-release-predicate.json
            ${{ runner.temp }}/production-release-subject.json
            ${{ runner.temp }}/rulesets-verify.json

  approve-and-tag:
    runs-on: ubuntu-latest
    needs:
      - verify-release
    environment: production-release-approval
    permissions:
      attestations: write
      artifact-metadata: write
      contents: write
      id-token: write
    steps:
      - name: Checkout exact release SHA
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_sha }}

      - name: Download verified release attestation inputs
        uses: actions/download-artifact@v4
        with:
          name: production-release-attestation-inputs
          path: ${{ runner.temp }}/production-release-attestation-inputs

      - name: Attest release approval manifest with a custom predicate
        id: attest
        uses: actions/attest@v4
        with:
          subject-path: ${{ runner.temp }}/production-release-attestation-inputs/production-release-subject.json
          predicate-path: ${{ runner.temp }}/production-release-attestation-inputs/production-release-predicate.json
          predicate-type: https://github.com/shj/homecook/attestations/production-release/v1

      - name: Create annotated prod tag in the approved job only
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          HOMECOOK_RELEASE_ATTESTATION_APP_TOKEN: ${{ secrets.HOMECOOK_RELEASE_ATTESTATION_APP_TOKEN }}
        run: |
          test -n "$HOMECOOK_RELEASE_ATTESTATION_APP_TOKEN"
          git fetch origin --tags --force
          if git rev-parse "refs/tags/$RELEASE_TAG^{tag}" >/dev/null 2>&1; then
            echo "release_tag already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" "$RELEASE_SHA" -m "Approved production release $RELEASE_TAG"
          git push "https://x-access-token:$HOMECOOK_RELEASE_ATTESTATION_APP_TOKEN@github.com/${{ github.repository }}.git" refs/tags/"$RELEASE_TAG"

      - name: Upload attestation bundle and approved artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-release-attestation
          path: |
            ${{ runner.temp }}/production-release-attestation-inputs/production-release-build.json
            ${{ runner.temp }}/production-release-attestation-inputs/production-release-predicate.json
            ${{ runner.temp }}/production-release-attestation-inputs/production-release-subject.json
            ${{ runner.temp }}/production-release-attestation-inputs/rulesets-verify.json
            ${{ steps.attest.outputs.bundle-path }}
