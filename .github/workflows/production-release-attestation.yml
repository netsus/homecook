name: Production Release Attestation

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact origin/master SHA to approve
        required: true
        type: string
      release_tag:
        description: Annotated prod tag name (prod-YYYYMMDD.N)
        required: true
        type: string
      member_receipt_1_b64:
        description: Canonical first run receipt encoded as base64
        required: true
        type: string
      member_receipt_2_b64:
        description: Canonical second run receipt encoded as base64
        required: true
        type: string
      repeatability_receipt_b64:
        description: Canonical repeatability receipt encoded as base64
        required: true
        type: string
      selection_b64:
        description: Canonical approved-ancestor selection encoded as base64; empty for current tip
        required: false
        type: string

permissions:
  attestations: write
  artifact-metadata: write
  contents: read
  id-token: write

jobs:
  verify-release:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: read
      statuses: read
    steps:
      - name: Validate canonical workflow identity and release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          test "${{ github.repository }}" = "netsus/homecook"
          test "${{ github.ref }}" = "refs/heads/master"
          test "${{ github.workflow_ref }}" = "netsus/homecook/.github/workflows/production-release-attestation.yml@refs/heads/master"
          [[ "$RELEASE_TAG" =~ ^prod-[0-9]{8}\.[0-9]+$ ]] || {
            echo "release_tag must match prod-YYYYMMDD.N exactly" >&2
            exit 1
          }

      - name: Resolve immutable workflow-head verifier authority
        id: workflow-head
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_HEAD_SHA: ${{ github.sha }}
        run: |
          workflow_head_tree="$(gh api "repos/netsus/homecook/git/commits/$WORKFLOW_HEAD_SHA" --jq '.tree.sha')"
          [[ "$WORKFLOW_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$workflow_head_tree" =~ ^[0-9a-f]{40}$ ]]
          printf 'workflow_head_sha=%s\n' "$WORKFLOW_HEAD_SHA" >> "$GITHUB_OUTPUT"
          printf 'workflow_head_tree=%s\n' "$workflow_head_tree" >> "$GITHUB_OUTPUT"

      - name: Checkout immutable workflow-head verifier
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          path: trusted-current-master
          persist-credentials: false
          ref: ${{ steps.workflow-head.outputs.workflow_head_sha }}

      - name: Bind exact current workflow run and self-suite authority
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          WORKFLOW_HEAD_SHA: ${{ steps.workflow-head.outputs.workflow_head_sha }}
          WORKFLOW_HEAD_TREE: ${{ steps.workflow-head.outputs.workflow_head_tree }}
        run: |
          gh api repos/netsus/homecook/actions/workflows/production-release-attestation.yml \
            > "$RUNNER_TEMP/release-workflow.json"
          canonical_workflow_id="$(jq -er '.id | select(type == "number" and . > 0)' "$RUNNER_TEMP/release-workflow.json")"
          jq -e '.path == ".github/workflows/production-release-attestation.yml"' \
            "$RUNNER_TEMP/release-workflow.json" > /dev/null
          gh api "repos/netsus/homecook/actions/runs/${{ github.run_id }}" \
            > "$RUNNER_TEMP/current-workflow-run.json"
          node scripts/build-production-release-workflow-evidence.mjs \
            --repository "netsus/homecook" \
            --source-ref "refs/heads/master" \
            --workflow-id "$canonical_workflow_id" \
            --workflow-path ".github/workflows/production-release-attestation.yml" \
            --workflow-head-sha "$WORKFLOW_HEAD_SHA" \
            --workflow-head-tree "$WORKFLOW_HEAD_TREE" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --run-json "$RUNNER_TEMP/current-workflow-run.json" \
            --release-sha "$RELEASE_SHA" \
            --workflow-authority-output "$RUNNER_TEMP/workflow-authority.json" \
            --suite-exclusion-output "$RUNNER_TEMP/release-workflow-suite-ids.json" \
            > "$RUNNER_TEMP/workflow-evidence.json"
        working-directory: trusted-current-master

      - name: Verify exact release SHA is reachable from origin/master
        id: git
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_HEAD_SHA: ${{ steps.workflow-head.outputs.workflow_head_sha }}
          WORKFLOW_HEAD_TREE: ${{ steps.workflow-head.outputs.workflow_head_tree }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$WORKFLOW_HEAD_SHA"
          test "$(git rev-parse "$WORKFLOW_HEAD_SHA^{tree}")" = "$WORKFLOW_HEAD_TREE"
          current_master_sha="$(gh api repos/netsus/homecook/git/ref/heads/master --jq '.object.sha')"
          git fetch --no-tags origin master
          git merge-base --is-ancestor "$WORKFLOW_HEAD_SHA" "$current_master_sha"
          git merge-base --is-ancestor "$RELEASE_SHA" "$WORKFLOW_HEAD_SHA"
          printf 'current_master_sha=%s\n' "$current_master_sha" >> "$GITHUB_OUTPUT"
          printf 'release_tree=%s\n' "$(git rev-parse "$RELEASE_SHA^{tree}")" >> "$GITHUB_OUTPUT"
        working-directory: trusted-current-master

      - name: Revalidate canonical rehearsal receipts and project authority
        env:
          MEMBER_RECEIPT_1_B64: ${{ inputs.member_receipt_1_b64 }}
          MEMBER_RECEIPT_2_B64: ${{ inputs.member_receipt_2_b64 }}
          REPEATABILITY_RECEIPT_B64: ${{ inputs.repeatability_receipt_b64 }}
          SELECTION_B64: ${{ inputs.selection_b64 }}
          CURRENT_MASTER_SHA: ${{ steps.git.outputs.current_master_sha }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_TREE: ${{ steps.git.outputs.release_tree }}
        run: |
          umask 077
          mkdir "$RUNNER_TEMP/rehearsal-receipts"
          printf '%s' "$MEMBER_RECEIPT_1_B64" | base64 --decode > "$RUNNER_TEMP/rehearsal-receipts/member-1.json"
          printf '%s' "$MEMBER_RECEIPT_2_B64" | base64 --decode > "$RUNNER_TEMP/rehearsal-receipts/member-2.json"
          printf '%s' "$REPEATABILITY_RECEIPT_B64" | base64 --decode > "$RUNNER_TEMP/rehearsal-receipts/repeatability.json"
          selection_digest="$(jq -r '.selection_digest // "none"' "$RUNNER_TEMP/rehearsal-receipts/repeatability.json")"
          selection_args=()
          if [ "$selection_digest" = "none" ]; then
            test -z "$SELECTION_B64"
          else
            [[ "$selection_digest" =~ ^[0-9a-f]{64}$ ]]
            test -n "$SELECTION_B64"
            mkdir "$RUNNER_TEMP/rehearsal-selection"
            selection_path="$RUNNER_TEMP/rehearsal-selection/$selection_digest.selection.json"
            printf '%s' "$SELECTION_B64" | base64 --decode > "$selection_path"
            selection_args=(--selection "$selection_path")
          fi
          node scripts/verify-production-release-rehearsal-authority.mjs \
            --member-receipt "$RUNNER_TEMP/rehearsal-receipts/member-1.json" \
            --member-receipt "$RUNNER_TEMP/rehearsal-receipts/member-2.json" \
            --repeatability-receipt "$RUNNER_TEMP/rehearsal-receipts/repeatability.json" \
            --release-sha "$RELEASE_SHA" \
            --release-tree "$RELEASE_TREE" \
            --repository-root "$GITHUB_WORKSPACE/trusted-current-master" \
            --current-master-sha "$CURRENT_MASTER_SHA" \
            "${selection_args[@]}" \
            --json > "$RUNNER_TEMP/rehearsal-authority.json"
          jq -e --arg release_sha "$RELEASE_SHA" --arg release_tree "$RELEASE_TREE" '
            .rehearsal_receipt_schema == "homecook.local-mac-production-rehearsal-repeatability-receipt.v1"
            and (
              ((.selection_digest == null) and ([.selected_sha,.selected_tree,.observed_master_sha,.observed_master_tree,.selected_at,.expires_at,.approver_role,.approver_id,.approval_digest] | all(. == null)))
              or ((.selection_digest | test("^[0-9a-f]{64}$")) and (.selected_sha == $release_sha) and (.selected_tree == $release_tree) and (.observed_master_sha | test("^[0-9a-f]{40}$")) and (.observed_master_tree | test("^[0-9a-f]{40}$")) and (.approver_role == "human-release-approver") and (.approver_id | type == "string" and length > 0) and (.approval_digest | test("^[0-9a-f]{64}$")) and (.selected_at | type == "string") and (.expires_at | type == "string"))
            )
            and (.sealed_bundle_digest | test("^[0-9a-f]{64}$"))
            and (.repeatability_receipt_digest | test("^[0-9a-f]{64}$"))
            and (.rehearsal_receipt_valid_until | type == "string")
          ' "$RUNNER_TEMP/rehearsal-authority.json" > /dev/null
        working-directory: trusted-current-master

      - name: Validate resolved committed desired state without admin readback
        run: |
          node scripts/manage-production-release-rulesets.mjs \
            verify --json > "$RUNNER_TEMP/desired-state-verify.json"
          jq -e '
            .actual_dir == null
            and ([.activation_blockers[] | select((startswith("missing_") | not))] | length == 0)
          ' "$RUNNER_TEMP/desired-state-verify.json" > /dev/null
        working-directory: trusted-current-master

      - name: Download complete selected-release check-suite and check-run pages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          gh api "repos/netsus/homecook/commits/$RELEASE_SHA/check-suites?per_page=100" \
            --paginate --slurp > "$RUNNER_TEMP/check-suite-pages.json"
          gh api "repos/netsus/homecook/commits/$RELEASE_SHA/check-runs?filter=all&per_page=100" \
            --paginate --slurp > "$RUNNER_TEMP/check-run-pages.json"
          jq '[.[].check_runs[]]' "$RUNNER_TEMP/check-run-pages.json" \
            > "$RUNNER_TEMP/check-runs.json"
          gh api "repos/netsus/homecook/actions/runs?head_sha=$RELEASE_SHA&per_page=100" \
            --paginate --slurp > "$RUNNER_TEMP/workflow-run-pages.json"
          jq '[.[].workflow_runs[]]' "$RUNNER_TEMP/workflow-run-pages.json" \
            > "$RUNNER_TEMP/workflow-runs.json"
        working-directory: trusted-current-master

      - name: Download all selected-release commit status pages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          gh api repos/netsus/homecook/commits/"$RELEASE_SHA"/statuses \
            --paginate --jq '.[]' \
            > "$RUNNER_TEMP/commit-statuses.jsonl"
          jq -s '.' "$RUNNER_TEMP/commit-statuses.jsonl" > "$RUNNER_TEMP/commit-statuses.json"
        working-directory: trusted-current-master

      - name: Build immutable external selected-release check evidence
        env:
          EXPECTED_RELEASE_CONTEXTS: build,changes,dependency-audit,policy,quality,security-function-authorization,security-smoke
        run: |
          node scripts/build-production-release-check-evidence.mjs \
            --check-run-pages-json "$RUNNER_TEMP/check-run-pages.json" \
            --check-suite-pages-json "$RUNNER_TEMP/check-suite-pages.json" \
            --commit-statuses-json "$RUNNER_TEMP/commit-statuses.json" \
            --excluded-check-suite-ids-json "$RUNNER_TEMP/release-workflow-suite-ids.json" \
            --expected-contexts "$EXPECTED_RELEASE_CONTEXTS" \
            --release-sha "${{ inputs.release_sha }}" \
            --workflow-runs-json "$RUNNER_TEMP/workflow-runs.json" \
            --output "$RUNNER_TEMP/external-check-evidence.json" \
            > "$RUNNER_TEMP/external-check-evidence-build.json"
          jq -e '.required_check_summary.rerun == 0' \
            "$RUNNER_TEMP/external-check-evidence.json" > /dev/null
        working-directory: trusted-current-master

      - name: Upload pre-approval external and control-plane evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-release-attestation-inputs
          path: |
            ${{ runner.temp }}/external-check-evidence.json
            ${{ runner.temp }}/check-run-pages.json
            ${{ runner.temp }}/check-suite-pages.json
            ${{ runner.temp }}/workflow-run-pages.json
            ${{ runner.temp }}/workflow-runs.json
            ${{ runner.temp }}/workflow-authority.json
            ${{ runner.temp }}/workflow-evidence.json
            ${{ runner.temp }}/current-workflow-run.json
            ${{ runner.temp }}/release-workflow-suite-ids.json
            ${{ runner.temp }}/desired-state-verify.json
            ${{ runner.temp }}/rehearsal-authority.json
            ${{ runner.temp }}/rehearsal-receipts/member-1.json
            ${{ runner.temp }}/rehearsal-receipts/member-2.json
            ${{ runner.temp }}/rehearsal-receipts/repeatability.json

  approve-and-tag:
    runs-on: ubuntu-latest
    needs:
      - verify-release
    environment: production-release-approval
    permissions:
      actions: read
      attestations: write
      artifact-metadata: write
      checks: read
      contents: read
      id-token: write
      statuses: read
    steps:
      - name: Capture approval-time master and exact current run immediately after approval
        id: approval-master
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_HEAD_SHA: ${{ github.sha }}
        run: |
          master_sha_at_approval="$(gh api repos/netsus/homecook/git/ref/heads/master --jq '.object.sha')"
          master_tree_at_approval="$(gh api "repos/netsus/homecook/git/commits/$master_sha_at_approval" --jq '.tree.sha')"
          workflow_head_tree="$(gh api "repos/netsus/homecook/git/commits/$WORKFLOW_HEAD_SHA" --jq '.tree.sha')"
          gh api "repos/netsus/homecook/actions/runs/${{ github.run_id }}" \
            > "$RUNNER_TEMP/current-workflow-run-at-approval.json"
          [[ "$master_sha_at_approval" =~ ^[0-9a-f]{40}$ ]]
          [[ "$master_tree_at_approval" =~ ^[0-9a-f]{40}$ ]]
          [[ "$workflow_head_tree" =~ ^[0-9a-f]{40}$ ]]
          printf 'master_sha_at_approval=%s\n' "$master_sha_at_approval" >> "$GITHUB_OUTPUT"
          printf 'master_tree_at_approval=%s\n' "$master_tree_at_approval" >> "$GITHUB_OUTPUT"
          printf 'workflow_head_sha=%s\n' "$WORKFLOW_HEAD_SHA" >> "$GITHUB_OUTPUT"
          printf 'workflow_head_tree=%s\n' "$workflow_head_tree" >> "$GITHUB_OUTPUT"

      - name: Checkout immutable workflow-head verifier after approval
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          path: trusted-current-master
          persist-credentials: false
          ref: ${{ steps.approval-master.outputs.workflow_head_sha }}

      - name: Download verified release attestation inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-release-attestation-inputs
          path: ${{ runner.temp }}/production-release-attestation-inputs

      - name: Revalidate exact workflow-run authority and approval-time master lineage
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          WORKFLOW_HEAD_SHA: ${{ steps.approval-master.outputs.workflow_head_sha }}
          WORKFLOW_HEAD_TREE: ${{ steps.approval-master.outputs.workflow_head_tree }}
          MASTER_SHA_AT_APPROVAL: ${{ steps.approval-master.outputs.master_sha_at_approval }}
          MASTER_TREE_AT_APPROVAL: ${{ steps.approval-master.outputs.master_tree_at_approval }}
        run: |
          mkdir -p "$RUNNER_TEMP/post-approval"
          gh api repos/netsus/homecook/actions/workflows/production-release-attestation.yml \
            > "$RUNNER_TEMP/post-approval/release-workflow.json"
          canonical_workflow_id="$(jq -er '.id | select(type == "number" and . > 0)' "$RUNNER_TEMP/post-approval/release-workflow.json")"
          jq -e '.path == ".github/workflows/production-release-attestation.yml"' \
            "$RUNNER_TEMP/post-approval/release-workflow.json" > /dev/null
          node scripts/build-production-release-workflow-evidence.mjs \
            --repository "netsus/homecook" \
            --source-ref "refs/heads/master" \
            --workflow-id "$canonical_workflow_id" \
            --workflow-path ".github/workflows/production-release-attestation.yml" \
            --workflow-head-sha "$WORKFLOW_HEAD_SHA" \
            --workflow-head-tree "$WORKFLOW_HEAD_TREE" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --run-json "$RUNNER_TEMP/current-workflow-run-at-approval.json" \
            --release-sha "$RELEASE_SHA" \
            --workflow-authority-output "$RUNNER_TEMP/post-approval/workflow-authority.json" \
            --suite-exclusion-output "$RUNNER_TEMP/post-approval/release-workflow-suite-ids.json" \
            > "$RUNNER_TEMP/post-approval/workflow-evidence.json"
          cmp "$RUNNER_TEMP/production-release-attestation-inputs/workflow-authority.json" \
            "$RUNNER_TEMP/post-approval/workflow-authority.json"
          cmp "$RUNNER_TEMP/production-release-attestation-inputs/release-workflow-suite-ids.json" \
            "$RUNNER_TEMP/post-approval/release-workflow-suite-ids.json"
          git fetch --no-tags origin master
          git merge-base --is-ancestor "$WORKFLOW_HEAD_SHA" "$MASTER_SHA_AT_APPROVAL"
          git merge-base --is-ancestor "$RELEASE_SHA" "$WORKFLOW_HEAD_SHA"
          test "$(git rev-parse "$MASTER_SHA_AT_APPROVAL^{tree}")" = "$MASTER_TREE_AT_APPROVAL"
          selection_digest="$(jq -r '.selection_digest // "none"' "$RUNNER_TEMP/production-release-attestation-inputs/rehearsal-authority.json")"
          if [ "$selection_digest" = "none" ]; then test "$RELEASE_SHA" = "$MASTER_SHA_AT_APPROVAL"; else [[ "$selection_digest" =~ ^[0-9a-f]{64}$ ]]; fi
          jq -n \
            --arg master_sha_at_approval "$MASTER_SHA_AT_APPROVAL" \
            --arg master_tree_at_approval "$MASTER_TREE_AT_APPROVAL" '
              {
                master_sha_at_approval: $master_sha_at_approval,
                master_tree_at_approval: $master_tree_at_approval
              }
            ' > "$RUNNER_TEMP/post-approval/approval-authority.json"
        working-directory: trusted-current-master

      - name: Revalidate canonical rehearsal receipts after approval
        env:
          CURRENT_MASTER_SHA: ${{ steps.approval-master.outputs.master_sha_at_approval }}
          MEMBER_RECEIPT_1_B64: ${{ inputs.member_receipt_1_b64 }}
          MEMBER_RECEIPT_2_B64: ${{ inputs.member_receipt_2_b64 }}
          REPEATABILITY_RECEIPT_B64: ${{ inputs.repeatability_receipt_b64 }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          SELECTION_B64: ${{ inputs.selection_b64 }}
          WORKFLOW_HEAD_SHA: ${{ steps.approval-master.outputs.workflow_head_sha }}
          WORKFLOW_HEAD_TREE: ${{ steps.approval-master.outputs.workflow_head_tree }}
        run: |
          umask 077
          test "$(git rev-parse HEAD)" = "$WORKFLOW_HEAD_SHA"
          test "$(git rev-parse "$WORKFLOW_HEAD_SHA^{tree}")" = "$WORKFLOW_HEAD_TREE"
          release_tree="$(git rev-parse "$RELEASE_SHA^{tree}")"
          mkdir "$RUNNER_TEMP/post-approval-selection"
          selection_digest="$(jq -r '.selection_digest // "none"' "$RUNNER_TEMP/production-release-attestation-inputs/rehearsal-authority.json")"
          selection_args=()
          if [ "$selection_digest" = "none" ]; then
            test -z "$SELECTION_B64"
          else
            [[ "$selection_digest" =~ ^[0-9a-f]{64}$ ]]
            test -n "$SELECTION_B64"
            selection_path="$RUNNER_TEMP/post-approval-selection/$selection_digest.selection.json"
            printf '%s' "$SELECTION_B64" | base64 --decode > "$selection_path"
            selection_args=(--selection "$selection_path")
          fi
          node scripts/verify-production-release-rehearsal-authority.mjs \
            --member-receipt "$RUNNER_TEMP/production-release-attestation-inputs/rehearsal-receipts/member-1.json" \
            --member-receipt "$RUNNER_TEMP/production-release-attestation-inputs/rehearsal-receipts/member-2.json" \
            --repeatability-receipt "$RUNNER_TEMP/production-release-attestation-inputs/rehearsal-receipts/repeatability.json" \
            --release-sha "$RELEASE_SHA" \
            --release-tree "$release_tree" \
            --repository-root "$GITHUB_WORKSPACE/trusted-current-master" \
            --current-master-sha "$CURRENT_MASTER_SHA" \
            "${selection_args[@]}" \
            --json > "$RUNNER_TEMP/post-approval/rehearsal-authority.json"
          cmp "$RUNNER_TEMP/production-release-attestation-inputs/rehearsal-authority.json" \
            "$RUNNER_TEMP/post-approval/rehearsal-authority.json"
        working-directory: trusted-current-master

      - name: Build deterministic annotated tag object from approval authority
        env:
          MASTER_SHA_AT_APPROVAL: ${{ steps.approval-master.outputs.master_sha_at_approval }}
          MASTER_TREE_AT_APPROVAL: ${{ steps.approval-master.outputs.master_tree_at_approval }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          WORKFLOW_HEAD_SHA: ${{ steps.approval-master.outputs.workflow_head_sha }}
          WORKFLOW_HEAD_TREE: ${{ steps.approval-master.outputs.workflow_head_tree }}
        run: |
          tag_epoch="$(git show -s --format=%ct "$RELEASE_SHA")"
          build_id="$(jq -er '.build_id' "$RUNNER_TEMP/post-approval/rehearsal-authority.json")"
          rehearsal_receipt_schema="$(jq -er '.rehearsal_receipt_schema' "$RUNNER_TEMP/post-approval/rehearsal-authority.json")"
          selection_digest="$(jq -r '.selection_digest // "none"' "$RUNNER_TEMP/post-approval/rehearsal-authority.json")"
          sealed_bundle_digest="$(jq -er '.sealed_bundle_digest' "$RUNNER_TEMP/post-approval/rehearsal-authority.json")"
          repeatability_receipt_digest="$(jq -er '.repeatability_receipt_digest' "$RUNNER_TEMP/post-approval/rehearsal-authority.json")"
          rehearsal_receipt_valid_until="$(jq -er '.rehearsal_receipt_valid_until' "$RUNNER_TEMP/post-approval/rehearsal-authority.json")"
          {
            printf 'object %s\n' "$RELEASE_SHA"
            printf 'type commit\n'
            printf 'tag %s\n' "$RELEASE_TAG"
            printf 'tagger homecook-release-attestation[bot] <homecook-release-attestation[bot]@users.noreply.github.com> %s +0000\n' "$tag_epoch"
            printf '\nApproved production release %s\n' "$RELEASE_TAG"
            printf 'build_id %s\n' "$build_id"
            printf 'rehearsal_receipt_schema %s\n' "$rehearsal_receipt_schema"
            printf 'workflow_head_sha %s\n' "$WORKFLOW_HEAD_SHA"
            printf 'workflow_head_tree %s\n' "$WORKFLOW_HEAD_TREE"
            printf 'master_sha_at_approval %s\n' "$MASTER_SHA_AT_APPROVAL"
            printf 'master_tree_at_approval %s\n' "$MASTER_TREE_AT_APPROVAL"
            printf 'selection_digest %s\n' "$selection_digest"
            printf 'sealed_bundle_digest %s\n' "$sealed_bundle_digest"
            printf 'repeatability_receipt_digest %s\n' "$repeatability_receipt_digest"
            printf 'rehearsal_receipt_valid_until %s\n' "$rehearsal_receipt_valid_until"
          } > "$RUNNER_TEMP/post-approval/production-release-tag-object.raw"
          release_tag_object_sha="$(git mktag < "$RUNNER_TEMP/post-approval/production-release-tag-object.raw")"
          [[ "$release_tag_object_sha" =~ ^[0-9a-f]{40}$ ]]
          printf '%s\n' "$release_tag_object_sha" > "$RUNNER_TEMP/post-approval/production-release-tag-object.sha"
        working-directory: trusted-current-master

      - name: Re-fetch and rebuild approval evidence after environment approval
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_RELEASE_CONTEXTS: build,changes,dependency-audit,policy,quality,security-function-authorization,security-smoke
        run: |
          test "${{ github.repository }}" = "netsus/homecook"
          test "${{ github.ref }}" = "refs/heads/master"
          test "${{ github.workflow_ref }}" = "netsus/homecook/.github/workflows/production-release-attestation.yml@refs/heads/master"
          [[ "$RELEASE_TAG" =~ ^prod-[0-9]{8}\.[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "${{ steps.approval-master.outputs.workflow_head_sha }}"
          current_master_sha="$(gh api repos/netsus/homecook/git/ref/heads/master --jq '.object.sha')"
          selection_digest="$(jq -r '.selection_digest // "none"' "$RUNNER_TEMP/post-approval/rehearsal-authority.json")"
          git fetch --no-tags origin master
          git merge-base --is-ancestor "${{ steps.approval-master.outputs.workflow_head_sha }}" "$current_master_sha"
          git merge-base --is-ancestor "${{ steps.approval-master.outputs.master_sha_at_approval }}" "$current_master_sha"
          git merge-base --is-ancestor "$RELEASE_SHA" "${{ steps.approval-master.outputs.workflow_head_sha }}"
          if [ "$selection_digest" = "none" ]; then test "${{ steps.approval-master.outputs.master_sha_at_approval }}" = "$RELEASE_SHA"; else [[ "$selection_digest" =~ ^[0-9a-f]{64}$ ]]; fi
          release_tree="$(git rev-parse "$RELEASE_SHA^{tree}")"
          release_tag_object_sha="$(cat "$RUNNER_TEMP/post-approval/production-release-tag-object.sha")"
          [[ "$release_tag_object_sha" =~ ^[0-9a-f]{40}$ ]]

          gh api "repos/netsus/homecook/commits/$RELEASE_SHA/check-suites?per_page=100" \
            --paginate --slurp > "$RUNNER_TEMP/post-approval/check-suite-pages.json"
          gh api "repos/netsus/homecook/commits/$RELEASE_SHA/check-runs?filter=all&per_page=100" \
            --paginate --slurp > "$RUNNER_TEMP/post-approval/check-run-pages.json"
          jq '[.[].check_runs[]]' "$RUNNER_TEMP/post-approval/check-run-pages.json" \
            > "$RUNNER_TEMP/post-approval/check-runs.json"
          gh api "repos/netsus/homecook/actions/runs?head_sha=$RELEASE_SHA&per_page=100" \
            --paginate --slurp > "$RUNNER_TEMP/post-approval/workflow-run-pages.json"
          jq '[.[].workflow_runs[]]' "$RUNNER_TEMP/post-approval/workflow-run-pages.json" \
            > "$RUNNER_TEMP/post-approval/workflow-runs.json"
          gh api repos/netsus/homecook/commits/"$RELEASE_SHA"/statuses \
            --paginate --jq '.[]' > "$RUNNER_TEMP/post-approval/commit-statuses.jsonl"
          jq -s '.' "$RUNNER_TEMP/post-approval/commit-statuses.jsonl" > "$RUNNER_TEMP/post-approval/commit-statuses.json"

          node scripts/build-production-release-check-evidence.mjs \
            --check-run-pages-json "$RUNNER_TEMP/post-approval/check-run-pages.json" \
            --check-suite-pages-json "$RUNNER_TEMP/post-approval/check-suite-pages.json" \
            --commit-statuses-json "$RUNNER_TEMP/post-approval/commit-statuses.json" \
            --excluded-check-suite-ids-json "$RUNNER_TEMP/post-approval/release-workflow-suite-ids.json" \
            --expected-contexts "$EXPECTED_RELEASE_CONTEXTS" \
            --release-sha "$RELEASE_SHA" \
            --workflow-runs-json "$RUNNER_TEMP/post-approval/workflow-runs.json" \
            --output "$RUNNER_TEMP/post-approval/external-check-evidence.json" \
            > "$RUNNER_TEMP/post-approval/external-check-evidence-build.json"
          cmp "$RUNNER_TEMP/production-release-attestation-inputs/external-check-evidence.json" \
            "$RUNNER_TEMP/post-approval/external-check-evidence.json"

          node scripts/build-production-release-attestation.mjs \
            --repository "netsus/homecook" \
            --release-sha "$RELEASE_SHA" \
            --release-tag "$RELEASE_TAG" \
            --release-tag-object-sha "$release_tag_object_sha" \
            --release-tree "$release_tree" \
            --check-run-pages-json "$RUNNER_TEMP/post-approval/check-run-pages.json" \
            --check-runs-json "$RUNNER_TEMP/post-approval/check-runs.json" \
            --check-suite-pages-json "$RUNNER_TEMP/post-approval/check-suite-pages.json" \
            --commit-statuses-json "$RUNNER_TEMP/post-approval/commit-statuses.json" \
            --excluded-check-suite-ids-json "$RUNNER_TEMP/post-approval/release-workflow-suite-ids.json" \
            --expected-contexts "$EXPECTED_RELEASE_CONTEXTS" \
            --rehearsal-authority-json "$RUNNER_TEMP/post-approval/rehearsal-authority.json" \
            --workflow-authority-json "$RUNNER_TEMP/post-approval/workflow-authority.json" \
            --workflow-runs-json "$RUNNER_TEMP/post-approval/workflow-runs.json" \
            --approval-authority-json "$RUNNER_TEMP/post-approval/approval-authority.json" \
            --subject-output "$RUNNER_TEMP/post-approval/production-release-subject.json" \
            --predicate-output "$RUNNER_TEMP/post-approval/production-release-predicate.json" \
            > "$RUNNER_TEMP/post-approval/production-release-build.json"
        working-directory: trusted-current-master

      - name: Compare approval evidence to preflight evidence
        run: |
          cmp "$RUNNER_TEMP/production-release-attestation-inputs/external-check-evidence.json" \
            "$RUNNER_TEMP/post-approval/external-check-evidence.json"
          cmp "$RUNNER_TEMP/production-release-attestation-inputs/workflow-authority.json" \
            "$RUNNER_TEMP/post-approval/workflow-authority.json"
        working-directory: trusted-current-master

      - name: Mint protected-tag GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.HOMECOOK_RELEASE_ATTESTATION_APP_ID }}
          private-key: ${{ secrets.HOMECOOK_RELEASE_ATTESTATION_APP_PRIVATE_KEY }}
          owner: netsus
          permission-contents: write
          repositories: homecook

      - name: Assert App ID equals the resolved tag ruleset Integration actor
        env:
          HOMECOOK_RELEASE_ATTESTATION_APP_ID: ${{ secrets.HOMECOOK_RELEASE_ATTESTATION_APP_ID }}
        run: |
          actor_id="$(jq -er '
            [.bypass_actors[] | select(.actor_type == "Integration" and .bypass_mode == "always") | .actor_id]
            | select(length == 1) | .[0] | select(type == "number" and . > 0)
          ' .github/rulesets/production-release-tag-creation.json)"
          test "$HOMECOOK_RELEASE_ATTESTATION_APP_ID" = "$actor_id"
        working-directory: trusted-current-master

      - name: Reconstruct exact annotated tag object and reject existing remote tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          matching_tag_refs="$(
            gh api "repos/netsus/homecook/git/matching-refs/tags/$RELEASE_TAG" \
              --paginate --jq '.[].ref'
          )"
          if grep -Fxq "refs/tags/$RELEASE_TAG" <<< "$matching_tag_refs"; then
            echo "release_tag already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          expected_tag_object_sha="$(cat "$RUNNER_TEMP/post-approval/production-release-tag-object.sha")"
          reconstructed_tag_object_sha="$(git mktag < "$RUNNER_TEMP/post-approval/production-release-tag-object.raw")"
          test "$reconstructed_tag_object_sha" = "$expected_tag_object_sha"
          test "$reconstructed_tag_object_sha" = "$(jq -r '.release_tag_object_sha' "$RUNNER_TEMP/post-approval/production-release-subject.json")"
          git update-ref "refs/tags/$RELEASE_TAG" "$reconstructed_tag_object_sha" ""
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{tag}")" = "$reconstructed_tag_object_sha"
        working-directory: trusted-current-master

      - name: Recheck origin/master immediately before protected tag push
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          release_tree="$(git rev-parse "$RELEASE_SHA^{tree}")"
          current_master_sha="$(gh api repos/netsus/homecook/git/ref/heads/master --jq '.object.sha')"
          git fetch --no-tags origin master
          git merge-base --is-ancestor "${{ steps.approval-master.outputs.workflow_head_sha }}" "$current_master_sha"
          git merge-base --is-ancestor "${{ steps.approval-master.outputs.master_sha_at_approval }}" "$current_master_sha"
          selection_digest="$(jq -r '.selection_digest // "none"' "$RUNNER_TEMP/post-approval/rehearsal-authority.json")"
          selection_args=()
          if [ "$selection_digest" != "none" ]; then
            selection_args=(--selection "$RUNNER_TEMP/post-approval-selection/$selection_digest.selection.json")
          fi
          node scripts/verify-production-release-rehearsal-authority.mjs \
            --member-receipt "$RUNNER_TEMP/production-release-attestation-inputs/rehearsal-receipts/member-1.json" \
            --member-receipt "$RUNNER_TEMP/production-release-attestation-inputs/rehearsal-receipts/member-2.json" \
            --repeatability-receipt "$RUNNER_TEMP/production-release-attestation-inputs/rehearsal-receipts/repeatability.json" \
            --release-sha "$RELEASE_SHA" \
            --release-tree "$release_tree" \
            --repository-root "$GITHUB_WORKSPACE/trusted-current-master" \
            --current-master-sha "$current_master_sha" \
            "${selection_args[@]}" \
            --minimum-remaining-seconds 900 \
            --json > "$RUNNER_TEMP/post-approval/tag-push-rehearsal-authority.json"
          cmp "$RUNNER_TEMP/post-approval/rehearsal-authority.json" \
            "$RUNNER_TEMP/post-approval/tag-push-rehearsal-authority.json"
          selection_digest="$(jq -r '.selection_digest // "none"' "$RUNNER_TEMP/post-approval/tag-push-rehearsal-authority.json")"
          git merge-base --is-ancestor "$RELEASE_SHA" "${{ steps.approval-master.outputs.workflow_head_sha }}"
          if [ "$selection_digest" = "none" ]; then test "${{ steps.approval-master.outputs.master_sha_at_approval }}" = "$RELEASE_SHA"; else [[ "$selection_digest" =~ ^[0-9a-f]{64}$ ]]; fi
          test "${{ steps.approval-master.outputs.master_sha_at_approval }}" = "$(jq -r '.master_sha_at_approval' "$RUNNER_TEMP/post-approval/production-release-subject.json")"
          test "${{ steps.approval-master.outputs.master_tree_at_approval }}" = "$(jq -r '.master_tree_at_approval' "$RUNNER_TEMP/post-approval/production-release-subject.json")"
          test "$release_tree" = "$(jq -r '.release_tree' "$RUNNER_TEMP/post-approval/production-release-subject.json")"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{tag}")" = "$(jq -r '.release_tag_object_sha' "$RUNNER_TEMP/post-approval/production-release-subject.json")"
          push_output="$(
            git push --porcelain \
              "https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/netsus/homecook.git" \
              "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          )"
          if ! grep -Fq "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG" <<< "$push_output" \
            || ! grep -Fq "[new tag]" <<< "$push_output"; then
            echo "protected tag creation race detected: remote ref was not newly created" >&2
            exit 1
          fi
        working-directory: trusted-current-master

      - name: Read back exact remote annotated tag object
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          expected_tag_object_sha="$(jq -r '.release_tag_object_sha' "$RUNNER_TEMP/post-approval/production-release-subject.json")"
          gh api "repos/netsus/homecook/git/ref/tags/$RELEASE_TAG" \
            > "$RUNNER_TEMP/post-approval/remote-tag-ref.json"
          jq -e --arg ref "refs/tags/$RELEASE_TAG" --arg sha "$expected_tag_object_sha" '
            .ref == $ref
            and .object.type == "tag"
            and .object.sha == $sha
          ' "$RUNNER_TEMP/post-approval/remote-tag-ref.json" > /dev/null || {
            echo "remote tag object SHA or annotated tag type mismatch" >&2
            exit 1
          }
          gh api "repos/netsus/homecook/git/tags/$expected_tag_object_sha" \
            > "$RUNNER_TEMP/post-approval/remote-tag-object.json"
          jq -e --arg tag "$RELEASE_TAG" --arg release_sha "${{ inputs.release_sha }}" '
            .tag == $tag
            and .object.type == "commit"
            and .object.sha == $release_sha
          ' "$RUNNER_TEMP/post-approval/remote-tag-object.json" > /dev/null
          sed '1,/^$/d' "$RUNNER_TEMP/post-approval/production-release-tag-object.raw" \
            > "$RUNNER_TEMP/post-approval/expected-tag-message.txt"
          jq -r '.message' "$RUNNER_TEMP/post-approval/remote-tag-object.json" \
            > "$RUNNER_TEMP/post-approval/remote-tag-message.txt"
          cmp "$RUNNER_TEMP/post-approval/expected-tag-message.txt" \
            "$RUNNER_TEMP/post-approval/remote-tag-message.txt"
        working-directory: trusted-current-master

      - name: Recheck current master immediately before attestation publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          release_tree="$(git rev-parse "$RELEASE_SHA^{tree}")"
          current_master_sha="$(gh api repos/netsus/homecook/git/ref/heads/master --jq '.object.sha')"
          git fetch --no-tags origin master
          git merge-base --is-ancestor "${{ steps.approval-master.outputs.workflow_head_sha }}" "$current_master_sha"
          git merge-base --is-ancestor "${{ steps.approval-master.outputs.master_sha_at_approval }}" "$current_master_sha"
          selection_digest="$(jq -r '.selection_digest // "none"' "$RUNNER_TEMP/post-approval/rehearsal-authority.json")"
          selection_args=()
          if [ "$selection_digest" != "none" ]; then
            selection_args=(--selection "$RUNNER_TEMP/post-approval-selection/$selection_digest.selection.json")
          fi
          node scripts/verify-production-release-rehearsal-authority.mjs \
            --member-receipt "$RUNNER_TEMP/production-release-attestation-inputs/rehearsal-receipts/member-1.json" \
            --member-receipt "$RUNNER_TEMP/production-release-attestation-inputs/rehearsal-receipts/member-2.json" \
            --repeatability-receipt "$RUNNER_TEMP/production-release-attestation-inputs/rehearsal-receipts/repeatability.json" \
            --release-sha "$RELEASE_SHA" \
            --release-tree "$release_tree" \
            --repository-root "$GITHUB_WORKSPACE/trusted-current-master" \
            --current-master-sha "$current_master_sha" \
            "${selection_args[@]}" \
            --minimum-remaining-seconds 900 \
            --json > "$RUNNER_TEMP/post-approval/pre-attestation-rehearsal-authority.json"
          cmp "$RUNNER_TEMP/post-approval/rehearsal-authority.json" \
            "$RUNNER_TEMP/post-approval/pre-attestation-rehearsal-authority.json"
          test "${{ steps.approval-master.outputs.master_sha_at_approval }}" = "$(jq -r '.master_sha_at_approval' "$RUNNER_TEMP/post-approval/approval-authority.json")"
          test "${{ steps.approval-master.outputs.master_tree_at_approval }}" = "$(jq -r '.master_tree_at_approval' "$RUNNER_TEMP/post-approval/approval-authority.json")"
          expected_tag_object_sha="$(jq -r '.release_tag_object_sha' "$RUNNER_TEMP/post-approval/production-release-subject.json")"
          test "$(gh api "repos/netsus/homecook/git/ref/tags/${{ inputs.release_tag }}" --jq '.object.sha')" = "$expected_tag_object_sha"
        working-directory: trusted-current-master

      - name: Re-fetch and rebuild attestation evidence immediately before publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_RELEASE_CONTEXTS: build,changes,dependency-audit,policy,quality,security-function-authorization,security-smoke
        run: |
          mkdir "$RUNNER_TEMP/pre-attestation"
          current_master_sha="$(gh api repos/netsus/homecook/git/ref/heads/master --jq '.object.sha')"
          git fetch --no-tags origin master
          git merge-base --is-ancestor "${{ steps.approval-master.outputs.workflow_head_sha }}" "$current_master_sha"
          git merge-base --is-ancestor "${{ steps.approval-master.outputs.master_sha_at_approval }}" "$current_master_sha"
          git merge-base --is-ancestor "$RELEASE_SHA" "${{ steps.approval-master.outputs.workflow_head_sha }}"
          selection_digest="$(jq -r '.selection_digest // "none"' "$RUNNER_TEMP/post-approval/pre-attestation-rehearsal-authority.json")"
          if [ "$selection_digest" = "none" ]; then test "${{ steps.approval-master.outputs.master_sha_at_approval }}" = "$RELEASE_SHA"; else [[ "$selection_digest" =~ ^[0-9a-f]{64}$ ]]; fi
          release_tree="$(git rev-parse "$RELEASE_SHA^{tree}")"
          release_tag_object_sha="$(jq -r '.release_tag_object_sha' "$RUNNER_TEMP/post-approval/production-release-subject.json")"
          [[ "$release_tag_object_sha" =~ ^[0-9a-f]{40}$ ]]

          gh api repos/netsus/homecook/actions/workflows/production-release-attestation.yml \
            > "$RUNNER_TEMP/pre-attestation/release-workflow.json"
          canonical_workflow_id="$(jq -er '.id | select(type == "number" and . > 0)' "$RUNNER_TEMP/pre-attestation/release-workflow.json")"
          jq -e '
            .path == ".github/workflows/production-release-attestation.yml"
          ' "$RUNNER_TEMP/pre-attestation/release-workflow.json" > /dev/null
          gh api "repos/netsus/homecook/actions/runs/${{ github.run_id }}" \
            > "$RUNNER_TEMP/pre-attestation/current-workflow-run.json"
          node scripts/build-production-release-workflow-evidence.mjs \
            --repository "netsus/homecook" \
            --source-ref "refs/heads/master" \
            --workflow-id "$canonical_workflow_id" \
            --workflow-path ".github/workflows/production-release-attestation.yml" \
            --workflow-head-sha "${{ steps.approval-master.outputs.workflow_head_sha }}" \
            --workflow-head-tree "${{ steps.approval-master.outputs.workflow_head_tree }}" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --run-json "$RUNNER_TEMP/pre-attestation/current-workflow-run.json" \
            --release-sha "$RELEASE_SHA" \
            --workflow-authority-output "$RUNNER_TEMP/pre-attestation/workflow-authority.json" \
            --suite-exclusion-output "$RUNNER_TEMP/pre-attestation/release-workflow-suite-ids.json" \
            > "$RUNNER_TEMP/pre-attestation/workflow-evidence.json"
          cmp "$RUNNER_TEMP/post-approval/workflow-authority.json" \
            "$RUNNER_TEMP/pre-attestation/workflow-authority.json"
          cmp "$RUNNER_TEMP/post-approval/release-workflow-suite-ids.json" \
            "$RUNNER_TEMP/pre-attestation/release-workflow-suite-ids.json"

          gh api "repos/netsus/homecook/commits/$RELEASE_SHA/check-suites?per_page=100" \
            --paginate --slurp > "$RUNNER_TEMP/pre-attestation/check-suite-pages.json"
          gh api "repos/netsus/homecook/commits/$RELEASE_SHA/check-runs?filter=all&per_page=100" \
            --paginate --slurp > "$RUNNER_TEMP/pre-attestation/check-run-pages.json"
          jq '[.[].check_runs[]]' "$RUNNER_TEMP/pre-attestation/check-run-pages.json" \
            > "$RUNNER_TEMP/pre-attestation/check-runs.json"
          gh api "repos/netsus/homecook/actions/runs?head_sha=$RELEASE_SHA&per_page=100" \
            --paginate --slurp > "$RUNNER_TEMP/pre-attestation/workflow-run-pages.json"
          jq '[.[].workflow_runs[]]' "$RUNNER_TEMP/pre-attestation/workflow-run-pages.json" \
            > "$RUNNER_TEMP/pre-attestation/workflow-runs.json"
          gh api repos/netsus/homecook/commits/"$RELEASE_SHA"/statuses \
            --paginate --jq '.[]' > "$RUNNER_TEMP/pre-attestation/commit-statuses.jsonl"
          jq -s '.' "$RUNNER_TEMP/pre-attestation/commit-statuses.jsonl" \
            > "$RUNNER_TEMP/pre-attestation/commit-statuses.json"

          node scripts/build-production-release-check-evidence.mjs \
            --check-run-pages-json "$RUNNER_TEMP/pre-attestation/check-run-pages.json" \
            --check-suite-pages-json "$RUNNER_TEMP/pre-attestation/check-suite-pages.json" \
            --commit-statuses-json "$RUNNER_TEMP/pre-attestation/commit-statuses.json" \
            --excluded-check-suite-ids-json "$RUNNER_TEMP/pre-attestation/release-workflow-suite-ids.json" \
            --expected-contexts "$EXPECTED_RELEASE_CONTEXTS" \
            --release-sha "$RELEASE_SHA" \
            --workflow-runs-json "$RUNNER_TEMP/pre-attestation/workflow-runs.json" \
            --output "$RUNNER_TEMP/pre-attestation/external-check-evidence.json" \
            > "$RUNNER_TEMP/pre-attestation/external-check-evidence-build.json"
          cmp "$RUNNER_TEMP/post-approval/external-check-evidence.json" \
            "$RUNNER_TEMP/pre-attestation/external-check-evidence.json"

          node scripts/build-production-release-attestation.mjs \
            --repository "netsus/homecook" \
            --release-sha "$RELEASE_SHA" \
            --release-tag "$RELEASE_TAG" \
            --release-tag-object-sha "$release_tag_object_sha" \
            --release-tree "$release_tree" \
            --check-run-pages-json "$RUNNER_TEMP/pre-attestation/check-run-pages.json" \
            --check-runs-json "$RUNNER_TEMP/pre-attestation/check-runs.json" \
            --check-suite-pages-json "$RUNNER_TEMP/pre-attestation/check-suite-pages.json" \
            --commit-statuses-json "$RUNNER_TEMP/pre-attestation/commit-statuses.json" \
            --excluded-check-suite-ids-json "$RUNNER_TEMP/pre-attestation/release-workflow-suite-ids.json" \
            --expected-contexts "$EXPECTED_RELEASE_CONTEXTS" \
            --rehearsal-authority-json "$RUNNER_TEMP/post-approval/pre-attestation-rehearsal-authority.json" \
            --workflow-authority-json "$RUNNER_TEMP/pre-attestation/workflow-authority.json" \
            --workflow-runs-json "$RUNNER_TEMP/pre-attestation/workflow-runs.json" \
            --approval-authority-json "$RUNNER_TEMP/post-approval/approval-authority.json" \
            --subject-output "$RUNNER_TEMP/pre-attestation/production-release-subject.json" \
            --predicate-output "$RUNNER_TEMP/pre-attestation/production-release-predicate.json" \
            > "$RUNNER_TEMP/pre-attestation/production-release-build.json"
          jq -e '.subject.required_check_summary and .predicate.required_check_summary' \
            "$RUNNER_TEMP/pre-attestation/production-release-build.json" > /dev/null
          test "$(gh api repos/netsus/homecook/git/ref/heads/master --jq '.object.sha')" = "$current_master_sha"
          test "$(gh api "repos/netsus/homecook/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$release_tag_object_sha"
        working-directory: trusted-current-master

      - name: Attest release approval manifest with a custom predicate
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/pre-attestation/production-release-subject.json
          predicate-path: ${{ runner.temp }}/pre-attestation/production-release-predicate.json
          predicate-type: https://github.com/netsus/homecook/attestations/production-release/v2

      - name: Upload attestation bundle and approved artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-release-attestation
          path: |
            ${{ runner.temp }}/pre-attestation/production-release-build.json
            ${{ runner.temp }}/pre-attestation/production-release-predicate.json
            ${{ runner.temp }}/pre-attestation/production-release-subject.json
            ${{ runner.temp }}/pre-attestation/check-runs.json
            ${{ runner.temp }}/pre-attestation/check-run-pages.json
            ${{ runner.temp }}/pre-attestation/check-suite-pages.json
            ${{ runner.temp }}/pre-attestation/workflow-run-pages.json
