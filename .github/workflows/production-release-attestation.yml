name: Production Release Attestation

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact origin/master SHA to approve
        required: true
        type: string
      release_tag:
        description: Annotated prod tag name (prod-YYYYMMDD.N)
        required: true
        type: string
      manifest_sha256:
        description: Release manifest SHA-256 digest
        required: true
        type: string

permissions:
  attestations: write
  contents: read
  id-token: write

jobs:
  operator-approval:
    runs-on: ubuntu-latest
    environment: production-release-approval
    steps:
      - name: Approval gate
        run: echo "Protected environment approval recorded."

  attest-release:
    runs-on: ubuntu-latest
    needs:
      - operator-approval
    steps:
      - name: Validate release tag format (prod-YYYYMMDD.N)
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          case "$RELEASE_TAG" in
            prod-[0-9][0-9][0-9][0-9][0-1][0-9][0-3][0-9].[0-9]*) ;;
            *)
              echo "release_tag must match prod-YYYYMMDD.N" >&2
              exit 1
              ;;
          esac

      - name: Checkout exact release SHA
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_sha }}

      - name: Verify exact release SHA equals origin/master
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          git fetch origin master --tags --force
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse refs/remotes/origin/master^{commit})" = "$RELEASE_SHA"
          RELEASE_TREE="$(git rev-parse "$RELEASE_SHA^{tree}")"
          printf 'RELEASE_TREE=%s\n' "$RELEASE_TREE" >> "$GITHUB_ENV"

      - name: Download current-head check runs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          gh api \
            repos/${{ github.repository }}/commits/"$RELEASE_SHA"/check-runs \
            --paginate \
            --jq '.check_runs[]' \
            > "$RUNNER_TEMP/check-runs.jsonl"
          jq -s '.' "$RUNNER_TEMP/check-runs.jsonl" > "$RUNNER_TEMP/check-runs.json"

      - name: Build terminal check summary attestation document (required_check_summary)
        env:
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          node scripts/build-production-release-attestation.mjs \
            --repository "${{ github.repository }}" \
            --release-sha "$RELEASE_SHA" \
            --release-tag "$RELEASE_TAG" \
            --release-tree "$RELEASE_TREE" \
            --manifest-digest "$MANIFEST_SHA256" \
            --check-runs-json "$RUNNER_TEMP/check-runs.json" \
            --output "$RUNNER_TEMP/production-release-attestation.json"

      - name: Upload attestation document
        uses: actions/upload-artifact@v4
        with:
          name: production-release-attestation
          path: ${{ runner.temp }}/production-release-attestation.json

      - name: Attest release approval document
        uses: actions/attest@v4
        with:
          subject-path: ${{ runner.temp }}/production-release-attestation.json
