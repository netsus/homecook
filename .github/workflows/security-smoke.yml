name: Security Smoke

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - develop

permissions:
  contents: read

env:
  # Build-only local placeholder. This workflow never contacts a Cloud project.
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
  NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000

jobs:
  security-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.32.1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run auth and session security smoke suite
        run: pnpm test:e2e:security

      - name: Upload security smoke report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-security-report
          path: |
            playwright-report
            test-results
