name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      security_function_authorization: ${{ steps.filter.outputs.security_function_authorization }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Resolve CI path filters
        id: filter
        run: node scripts/ci-path-filter.mjs

  quality:
    needs: scope
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed when scope resolution failed
        if: needs.scope.result != 'success'
        run: |
          echo "CI scope resolution did not succeed." >&2
          exit 1

      - name: Report not applicable
        if: needs.scope.result == 'success' && needs.scope.outputs.code != 'true'
        run: echo "N/A - no code-relevant paths changed."

      - name: Checkout
        if: needs.scope.outputs.code == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup pnpm
        if: needs.scope.outputs.code == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.32.1

      - name: Setup Node
        if: needs.scope.outputs.code == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: needs.scope.outputs.code == 'true'
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: needs.scope.outputs.code == 'true'
        run: pnpm lint

      - name: Typecheck
        if: needs.scope.outputs.code == 'true'
        run: pnpm typecheck

      - name: Test
        if: needs.scope.outputs.code == 'true'
        run: pnpm test

      - name: Ingredient nutrition PostgreSQL integration
        if: needs.scope.outputs.code == 'true'
        run: pnpm test:nutrition-model:postgres

  build:
    needs: scope
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed when scope resolution failed
        if: needs.scope.result != 'success'
        run: |
          echo "CI scope resolution did not succeed." >&2
          exit 1

      - name: Report not applicable
        if: needs.scope.result == 'success' && needs.scope.outputs.code != 'true'
        run: echo "N/A - no code-relevant paths changed."

      - name: Checkout
        if: needs.scope.outputs.code == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup pnpm
        if: needs.scope.outputs.code == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.32.1

      - name: Setup Node
        if: needs.scope.outputs.code == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: needs.scope.outputs.code == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build
        if: needs.scope.outputs.code == 'true'
        run: pnpm build

  security-function-authorization:
    needs: scope
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed when scope resolution failed
        if: needs.scope.result != 'success'
        run: |
          echo "CI scope resolution did not succeed." >&2
          exit 1

      - name: Report not applicable
        if: needs.scope.result == 'success' && needs.scope.outputs.security_function_authorization != 'true'
        run: echo "N/A - no security-function authorization paths changed."

      - name: Checkout
        if: needs.scope.outputs.security_function_authorization == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup pnpm
        if: needs.scope.outputs.security_function_authorization == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.32.1

      - name: Setup Node
        if: needs.scope.outputs.security_function_authorization == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Supabase CLI
        if: needs.scope.outputs.security_function_authorization == 'true'
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.110.0

      - name: Install dependencies
        if: needs.scope.outputs.security_function_authorization == 'true'
        run: pnpm install --frozen-lockfile

      - name: Start fresh local Supabase and replay migrations
        if: needs.scope.outputs.security_function_authorization == 'true'
        run: supabase start

      - name: Validate fresh live state, recorded environment states, and role matrix
        if: needs.scope.outputs.security_function_authorization == 'true'
        run: pnpm verify:security-functions
        env:
          SECURITY_FUNCTION_ENVIRONMENT: fresh
