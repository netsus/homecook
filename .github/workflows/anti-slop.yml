name: Anti Slop

on:
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "stores/**"
      - "types/**"
      - "ui/**"
      - "tools/oxlint/**"
      - ".agents/skills/homecook-typescript-evidence-review/SKILL.md"
      - "AGENTS.md"
      - "THIRD_PARTY_NOTICES.md"
      - "docs/engineering/codex-quality-methods-20261011.md"
      - "scripts/run-anti-slop.mjs"
      - "scripts/test-anti-slop-fixtures.mjs"
      - "scripts/verify-codex-quality-tooling.mjs"
      - "tests/fixtures/anti-slop/**"
      - ".oxlintrc.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/anti-slop.yml"
  push:
    branches: [master]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "stores/**"
      - "types/**"
      - "ui/**"
      - "tools/oxlint/**"
      - ".agents/skills/homecook-typescript-evidence-review/SKILL.md"
      - "AGENTS.md"
      - "THIRD_PARTY_NOTICES.md"
      - "docs/engineering/codex-quality-methods-20261011.md"
      - "scripts/run-anti-slop.mjs"
      - "scripts/test-anti-slop-fixtures.mjs"
      - "scripts/verify-codex-quality-tooling.mjs"
      - "tests/fixtures/anti-slop/**"
      - ".oxlintrc.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/anti-slop.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:codex-quality-tooling
      - run: pnpm verify:anti-slop
      - run: pnpm typecheck
